<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proches</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#E7EBE3; --paper:#FBFAF7; --ink:#26302B; --ink-soft:#5B665F; --line:#D7DBCF;
    --week:#45624F; --sunday:#C98A3E; --keepsake:#B17272;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); font-family:'Inter',sans-serif; color:var(--ink); min-height:100vh;}
  .app{max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:40px;}

  .topbar{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:18px 20px 0;}
  .topbar-icon{width:40px; height:40px; cursor:pointer; justify-self:start;}
  .topbar-icon img{width:100%; height:100%; object-fit:contain; display:block;}
  .circle-logo{width:44px; height:44px; cursor:pointer; justify-self:end;}
  .circle-logo img{width:100%; height:100%; object-fit:contain; display:block; pointer-events:none;}
  .camera-btn{
    justify-self:center; width:46px; height:46px; border-radius:50%; background:var(--week);
    display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 3px 8px rgba(38,48,43,0.28);
  }
  .camera-btn svg{width:22px; height:22px;}
  .signout{font-size:11.5px; color:var(--ink-soft); cursor:pointer; text-decoration:underline; display:block; margin-top:8px;}

  .profile{text-align:center; padding:8px 24px 4px;}
  .profile-clip{width:6px; height:9px; background:var(--ink-soft); opacity:0.5; border-radius:1px; margin:0 auto -2px;}
  .profile-frame{width:64px; height:64px; margin:0 auto; border-radius:4px; background:#fff; padding:4px 4px 9px; box-shadow:0 5px 12px rgba(38,48,43,0.16);}
  .profile-frame-inner{width:100%; height:100%; border-radius:2px; display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Fraunces',serif; font-weight:600; font-size:22px;}
  .profile-name{font-family:'Fraunces',serif; font-weight:600; font-size:17px; margin-top:8px;}
  .profile-tag{font-family:'Fraunces',serif; font-style:italic; font-size:12px; color:var(--ink-soft); margin-top:2px;}

  main{padding:0 20px;}
  .card{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px;}
  .eyebrow{font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-soft); margin:22px 0 8px; font-weight:600; text-align:center;}

  input, textarea{
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-family:'Inter',sans-serif;
    font-size:14px; color:var(--ink); margin-bottom:10px; background:#fff;
  }
  textarea{resize:none;}
  button{
    background:var(--week); color:#fff; border:none; border-radius:10px; padding:11px; font-weight:600;
    font-size:14px; cursor:pointer; width:100%;
  }
  button:disabled{opacity:0.5; cursor:not-allowed;}
  .link-btn{background:none; border:none; color:var(--week); text-decoration:underline; font-size:13px; padding:0; width:auto; cursor:pointer;}
  .row{display:flex; gap:8px;}
  .row input{flex:1; margin-bottom:0;}
  .row button{width:auto; padding:0 16px;}
  .msg{font-size:13px; padding:6px 0 0; color:var(--ink-soft);}
  .msg.error{color:#B0413E;}

  .upload-zone{
    display:block; border:1.5px dashed var(--line); border-radius:12px; padding:16px; text-align:center;
    color:var(--ink-soft); font-size:13px; cursor:pointer; margin-bottom:10px; background:#fff;
  }
  .upload-zone b{display:block; color:var(--ink); font-family:'Fraunces',serif; font-size:14px; margin-bottom:2px; font-weight:600;}
  .upload-zone input{display:none;}
  .file-picked{font-size:12px; color:var(--week); margin-top:4px; font-weight:600;}

  .eyebrow-inline{font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; margin-bottom:8px;}

  .friend-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .friend-row:last-child{border-bottom:none;}
  .avatar{width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px; flex-shrink:0;}
  .friend-name{font-weight:600; font-size:13.5px; flex:1;}
  .req-btn{width:28px; height:28px; border-radius:50%; border:none; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .req-accept{background:var(--week); color:#fff;}
  .req-decline{background:var(--paper); color:var(--ink-soft); border:1px solid var(--line);}

  .post{margin-bottom:16px; padding:14px 14px 16px;}
  .post-photo{position:relative; background:#fff; border-radius:3px; padding:5px 5px 22px; box-shadow:0 4px 10px rgba(38,48,43,0.18); margin-bottom:2px;}
  .post-photo img{width:100%; display:block; max-height:420px; object-fit:cover; border-radius:1px;}
  .post-photo .tape{position:absolute; top:-7px; left:50%; width:34px; height:14px; margin-left:-17px; transform:rotate(-3deg); background:rgba(250,242,214,0.7); border:1px solid rgba(38,48,43,0.06); box-shadow:0 1px 2px rgba(38,48,43,0.12);}
  .post-body{padding:10px 4px 0;}
  .post-author{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
  .post-author b{font-size:13.5px;}
  .post-date{color:var(--ink-soft); font-size:11px; margin-left:auto;}
  .post-caption{font-size:13.5px; line-height:1.5;}
  .empty{text-align:center; padding:30px 16px; color:var(--ink-soft); font-size:13px; font-family:'Fraunces',serif; font-style:italic;}

  /* ---- Album des mois : livre à pages qui se tournent ---- */
  .book-wrap{padding:0 6px; perspective:1400px; margin-bottom:16px;}
  .book{position:relative; background:linear-gradient(160deg,#4a3527,#2f2018); border-radius:10px; padding:9px 6px; box-shadow:0 8px 20px rgba(0,0,0,0.25);}
  .stack{position:relative;}
  .stack::before, .stack::after{content:""; position:absolute; left:3px; right:3px; top:2px; bottom:-3px; border-radius:4px; background:#F2EFE6; border:1px solid var(--line); z-index:0;}
  .stack::before{transform:translateY(3px); background:#EDEAE0;}
  .stack::after{transform:translateY(6px); background:#E8E4D8; z-index:-1;}
  .page{position:relative; z-index:2; background:#FCFAF7; border-radius:4px; padding:14px 6px 12px; box-shadow:2px 3px 10px rgba(38,48,43,0.12);}
  .spread{display:flex; align-items:stretch;}
  .leaf-slot{position:relative; flex:1; min-width:0; z-index:1;}
  .leaf-slot.elevated{z-index:5;}
  .leaf-static{padding:0 5px; touch-action:pan-y;}
  .leaf-flap{position:absolute; inset:0; display:none;}
  .leaf-flap.active{display:block;}
  .leaf-underlay{position:absolute; inset:0; padding:0 5px; background:#FCFAF7; z-index:1;}
  .leaf-flip{position:absolute; inset:0; z-index:2; transform-style:preserve-3d;}
  .spread > .leaf-slot:first-child .leaf-flip{transform-origin:right center;}
  .spread > .leaf-slot:last-child .leaf-flip{transform-origin:left center;}
  .flip-face{position:absolute; inset:0; padding:0 5px; backface-visibility:hidden; background:#FCFAF7;}
  .flip-face-back{transform:rotateY(180deg);}
  .leaf-flip.flip-fwd{animation:flipFwd 0.9s cubic-bezier(.45,.05,.55,.95);}
  .leaf-flip.flip-back{animation:flipBack 0.9s cubic-bezier(.45,.05,.55,.95);}
  @keyframes flipFwd{
    0%{transform:rotateY(0deg); box-shadow:2px 0 6px rgba(38,48,43,0.1);}
    45%{box-shadow:-30px 10px 45px rgba(0,0,0,0.4);}
    50%{transform:rotateY(-90deg); box-shadow:-30px 10px 45px rgba(0,0,0,0.4);}
    100%{transform:rotateY(-180deg); box-shadow:2px 0 6px rgba(38,48,43,0.1);}
  }
  @keyframes flipBack{
    0%{transform:rotateY(0deg); box-shadow:-2px 0 6px rgba(38,48,43,0.1);}
    45%{box-shadow:30px 10px 45px rgba(0,0,0,0.4);}
    50%{transform:rotateY(90deg); box-shadow:30px 10px 45px rgba(0,0,0,0.4);}
    100%{transform:rotateY(180deg); box-shadow:-2px 0 6px rgba(38,48,43,0.1);}
  }
  .leaf-year{
    text-align:center; font-family:'Fraunces',serif; font-style:italic; font-weight:600; font-size:14px;
    color:var(--ink); margin-bottom:12px; display:flex; align-items:center; gap:7px;
  }
  .leaf-year::before, .leaf-year::after{content:""; flex:1; height:1px; background:var(--ink-soft); opacity:0.4;}
  .gutter{width:11px; flex-shrink:0; background:linear-gradient(to right, rgba(38,48,43,0.16), rgba(38,48,43,0.02) 40%, rgba(38,48,43,0.02) 60%, rgba(38,48,43,0.16));}
  .grid6{display:grid; grid-template-columns:repeat(2,1fr); gap:14px 8px;}
  .mini-frame{width:100%; position:relative; background:#fff; border-radius:2px; padding:4px 4px 18px; box-shadow:0 4px 9px rgba(38,48,43,0.2); touch-action:manipulation;}
  .mini-photo, .mini-photo-empty{width:100%; aspect-ratio:4/5; border-radius:1px; display:block; object-fit:cover; background:#EFEBE0;}
  .mini-frame .mini-caption{position:absolute; left:2px; right:2px; bottom:4px; text-align:center; font-family:'Fraunces',serif; font-style:italic; font-size:9px; color:var(--ink-soft); text-transform:capitalize;}
  .mini-frame.not-started{background:transparent; box-shadow:none; padding:0;}
  .mini-frame.not-started .mini-photo-empty{display:none;}
  .mini-tape{position:absolute; top:-6px; left:50%; width:28px; height:12px; margin-left:-14px; transform:rotate(-3deg); background:rgba(250,242,214,0.7); border:1px solid rgba(38,48,43,0.06); box-shadow:0 1px 2px rgba(38,48,43,0.12);}
  .mini-count{position:absolute; top:6px; right:6px; background:rgba(38,48,43,0.65); color:#fff; font-size:9px; padding:1px 5px; border-radius:8px; font-weight:700;}
  .turn-hint{text-align:center; margin-top:8px; font-size:10px; color:var(--ink-soft); font-family:'Fraunces',serif; font-style:italic;}

  .center-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .auth-card{width:100%; max-width:340px; background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:26px;}
  .auth-title{font-family:'Fraunces',serif; font-weight:600; font-size:22px; text-align:center; margin-bottom:4px;}
  .auth-tag{text-align:center; color:var(--ink-soft); font-size:12.5px; margin-bottom:20px; font-style:italic; font-family:'Fraunces',serif;}

  /* ---- Modals (caméra + mois de l'album) ---- */
  .modal-overlay{position:fixed; inset:0; background:var(--bg); z-index:200; display:none; flex-direction:column;}
  .modal-overlay.open{display:flex;}
  .modal-head{display:flex; align-items:center; gap:12px; padding:18px 18px 6px;}
  .modal-back{width:32px; height:32px; border-radius:50%; background:var(--paper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; color:var(--ink-soft); flex-shrink:0;}
  .modal-title{font-family:'Fraunces',serif; font-weight:600; font-size:17px; text-transform:capitalize;}
  .modal-body{flex:1; overflow-y:auto; padding:0 18px 24px;}

  .month-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px;}
  .month-item{position:relative; aspect-ratio:4/5; border-radius:6px; overflow:hidden; background:#eee;}
  .month-item img, .month-item video{width:100%; height:100%; object-fit:cover; display:block;}

  .camera-modal{background:#000;}
  .camera-modal video{flex:1; width:100%; object-fit:cover; background:#111;}
  .camera-topbar{position:absolute; top:0; left:0; right:0; padding:16px; display:flex; justify-content:flex-end; z-index:2;}
  .camera-close{color:#fff; font-size:22px; cursor:pointer; padding:6px;}
  .camera-bottombar{position:absolute; bottom:0; left:0; right:0; padding:26px 24px; display:flex; align-items:center; justify-content:space-between; z-index:2;}
  .camera-gallery-btn{width:44px; height:44px; border-radius:8px; background:rgba(255,255,255,0.18); display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer;}
  .camera-shutter{width:66px; height:66px; border-radius:50%; background:#fff; border:4px solid rgba(255,255,255,0.4); cursor:pointer;}
  .camera-preview{position:absolute; inset:0; background:var(--bg); display:none; flex-direction:column; padding:20px;}
  .camera-preview.open{display:flex;}
  .camera-preview-media{width:100%; border-radius:8px; overflow:hidden; margin-bottom:10px; background:#000;}
  .camera-preview-media img, .camera-preview-media video{width:100%; max-height:55vh; object-fit:cover; display:block;}
  .camera-preview-actions{display:flex; gap:10px; margin-top:6px;}
  .camera-preview-actions button{flex:1;}
  .ghost-btn{background:transparent !important; border:1px solid var(--line); color:var(--ink-soft) !important;}

  /* ---- Story plein écran (mois) ---- */
  .story-overlay{position:fixed; inset:0; background:#000; z-index:300; display:none; flex-direction:column;}
  .story-overlay.open{display:flex;}
  .story-bars{display:flex; gap:4px; padding:10px 10px 0;}
  .story-bars .bar{flex:1; height:2.5px; background:rgba(255,255,255,0.3); border-radius:2px; overflow:hidden;}
  .story-bars .bar .fill{height:100%; width:0%; background:#fff;}
  .story-bars .bar.done .fill{width:100%;}
  .story-bars .bar.active .fill{animation:fillbar 3s linear forwards;}
  @keyframes fillbar{from{width:0%;} to{width:100%;}}
  .story-head{display:flex; align-items:center; gap:10px; padding:12px 14px;}
  .story-name{color:#fff; font-size:13.5px; font-weight:600; text-transform:capitalize;}
  .story-close{margin-left:auto; color:#fff; font-size:20px; cursor:pointer; padding:4px;}
  .story-photo{flex:1; display:flex; align-items:center; justify-content:center; position:relative; background:#111;}
  .story-photo img, .story-photo video{max-width:100%; max-height:100%; object-fit:contain;}
  .story-taps{position:absolute; inset:0; display:flex;}
  .story-taps div{flex:1;}
  .story-caption{
    position:absolute; left:0; right:0; bottom:0; z-index:2; color:#fff; font-size:13px; line-height:1.45;
    padding:16px 16px 20px; cursor:pointer;
    background:linear-gradient(to top, rgba(0,0,0,0.65), rgba(0,0,0,0));
  }
  .story-caption.expanded{ top:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; padding:24px; }
  .story-caption .more{color:rgba(255,255,255,0.7); font-weight:600; text-decoration:underline;}

  /* ---- Menu d'action (appui long) ---- */
  .action-sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:400; display:none; align-items:flex-end;}
  .action-sheet-backdrop.open{display:flex;}
  .action-sheet{width:100%; max-width:480px; margin:0 auto; background:var(--paper); border-radius:16px 16px 0 0; padding:14px; padding-bottom:26px;}
  .action-sheet-label{text-align:center; font-family:'Fraunces',serif; font-style:italic; color:var(--ink-soft); font-size:12.5px; margin-bottom:10px; text-transform:capitalize;}
  .action-sheet-btn{text-align:center; padding:13px; font-weight:600; font-size:15px; border-radius:10px; cursor:pointer; color:var(--week);}
  .action-sheet-btn.cancel{color:var(--ink-soft); margin-top:6px;}
  .action-sheet-btn:active{background:var(--bg);}

  /* ---- Éditeur galerie : ajouter / supprimer / réordonner ---- */
  .editor-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); touch-action:none;}
  .editor-row.dragging{opacity:0.5;}
  .editor-handle{font-size:18px; color:var(--ink-soft); cursor:grab; padding:6px; touch-action:none;}
  .editor-thumb{width:64px; height:64px; border-radius:8px; overflow:hidden; background:#eee; flex-shrink:0;}
  .editor-thumb img, .editor-thumb video{width:100%; height:100%; object-fit:cover;}
  .editor-del{margin-left:auto; width:28px; height:28px; border-radius:50%; background:var(--paper); border:1px solid var(--line); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px;}
  .editor-info{flex:1; min-width:0; cursor:pointer;}
  .editor-caption{font-size:12.5px; color:var(--ink); line-height:1.4; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .editor-caption.placeholder{color:var(--ink-soft); font-style:italic; font-family:'Fraunces',serif;}
  .caption-panel-media{width:100%; border-radius:10px; overflow:hidden; margin-bottom:12px; background:#000;}
  .caption-panel-media img, .caption-panel-media video{width:100%; max-height:50vh; object-fit:contain; display:block;}
</style>
</head>

const palette = ['#45624F','#B17272','#C98A3E','#5B665F','#4C7A8C','#7C6A9C'];
function colorFor(str){
  let h = 0;
  for(const c of str) h = (h*31 + c.charCodeAt(0)) % palette.length;
  return palette[h];
}

let session = null;
let myProfile = null;

/* ---------- Rendu racine ---------- */
async function render(){
  const { data:{ session: s } } = await sb.auth.getSession();
  session = s;
  if(!session){ renderAuth(); return; }

  const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if(!profile){ renderChooseUsername(); return; }
  myProfile = profile;
  renderApp();
}

/* ---------- Écran de connexion ---------- */
function renderAuth(mode='signin'){
  document.getElementById('root').innerHTML = `
    <div class="center-screen">
      <div class="auth-card">
        <div class="profile-clip"></div>
        <div class="profile-frame" style="margin-bottom:10px;"><div class="profile-frame-inner" style="background:var(--week);">P</div></div>
        <div class="auth-title">Proches</div>
        <div class="auth-tag">Un moment par jour, un souvenir par mois.</div>
        <div id="authMsg"></div>
        <input id="authEmail" type="email" placeholder="Adresse email">
        <input id="authPassword" type="password" placeholder="Mot de passe (6 caractères min.)">
        <button id="authSubmit">${mode==='signin' ? 'Se connecter' : "Créer mon compte"}</button>
        <div style="text-align:center; margin-top:14px;">
          ${mode==='signin'
            ? `Pas encore de compte ? <button class="link-btn" onclick="renderAuth('signup')">En créer un</button>`
            : `Déjà un compte ? <button class="link-btn" onclick="renderAuth('signin')">Se connecter</button>`}
        </div>
      </div>
    </div>`;
  document.getElementById('authSubmit').onclick = async ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const msg = document.getElementById('authMsg');
    msg.innerHTML = `<div class="msg">Un instant…</div>`;
    const fn = mode==='signin' ? sb.auth.signInWithPassword : sb.auth.signUp;
    const { error } = await fn.call(sb.auth, { email, password });
    if(error){ msg.innerHTML = `<div class="msg error">${error.message}</div>`; return; }
    if(mode==='signup'){
      msg.innerHTML = `<div class="msg">Compte créé ! Si une confirmation par email est demandée, vérifiez votre boîte mail, sinon vous êtes déjà connecté(e).</div>`;
    }
    render();
  };
}

/* ---------- Choix du nom d'utilisateur (première connexion) ---------- */
function renderChooseUsername(){
  document.getElementById('root').innerHTML = `

async function publishMedia(file, caption, postDateISO){
  const mediaType = file.type && file.type.startsWith('video') ? 'video' : 'photo';
  const path = `${session.user.id}/${Date.now()}_${file.name || (mediaType+'.jpg')}`;
  const { error: upErr } = await sb.storage.from('photos').upload(path, file);
  if(upErr){ return { error: upErr.message }; }
  const { data: pub } = sb.storage.from('photos').getPublicUrl(path);
  const { error: insErr } = await sb.from('posts').insert({
    author_id: session.user.id, media_url: pub.publicUrl, media_type: mediaType, caption: caption||'', post_date: postDateISO
  });
  if(insErr){ return { error: insErr.message }; }
  return { error: null };
}

async function handleAddFriend(){

async function loadCircle(){
  const uid = session.user.id;
  const { data: circles } = await sb.from('circles').select('*').or(`requester_id.eq.${uid},addressee_id.eq.${uid}`);
  const incoming = (circles||[]).filter(c=>c.addressee_id===uid && c.status==='pending');
  const accepted = (circles||[]).filter(c=>c.status==='accepted');
  const otherIds = accepted.map(c=> c.requester_id===uid ? c.addressee_id : c.requester_id);

  const incomingBox = document.getElementById('incomingRequests');
  if(incoming.length){
    const ids = incoming.map(c=>c.requester_id);
    const { data: people } = await sb.from('profiles').select('id,username,avatar_color').in('id', ids);
    incomingBox.innerHTML = `<div class="eyebrow-inline">Demandes reçues</div>` + incoming.map(c=>{
      const p = (people||[]).find(x=>x.id===c.requester_id) || {username:'?', avatar_color:'#888'};
      return `<div class="friend-row">
        <div class="avatar" style="background:${p.avatar_color}">${p.username[0].toUpperCase()}</div>
        <div class="friend-name">${p.username}</div>
        <div class="req-btn req-accept" onclick="respondRequest('${c.id}','accepted')">✓</div>
        <div class="req-btn req-decline" onclick="respondRequest('${c.id}','decline')">✕</div>
      </div>`;
    }).join('');
  } else { incomingBox.innerHTML = ''; }

  const listBox = document.getElementById('friendsList');
  if(otherIds.length){
    const { data: people } = await sb.from('profiles').select('id,username,avatar_color').in('id', otherIds);
    listBox.innerHTML = `<div class="eyebrow-inline">Vos proches</div>` + (people||[]).map(p=>`
      <div class="friend-row">
        <div class="avatar" style="background:${p.avatar_color}">${p.username[0].toUpperCase()}</div>
        <div class="friend-name">${p.username}</div>
      </div>`).join('');
  } else {
    listBox.innerHTML = `<div class="msg">Aucun proche pour l'instant.</div>`;
  }
}

async function respondRequest(circleId, action){
  if(action === 'decline'){ await sb.from('circles').delete().eq('id', circleId); }
  else { await sb.from('circles').update({ status:'accepted' }).eq('id', circleId); }
  loadCircle();
}

/* ---------- Album des mois (vraies photos, effet de page qui tourne) ---------- */
const monthsFR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
let albumState = null;

const MIN_YEAR_BACK = 15;

async function loadAlbum(){
  const now = new Date();
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth();

  const { data: myPosts } = await sb.from('posts').select('id,media_url,media_type,post_date,sort_order,caption').eq('author_id', session.user.id).order('sort_order').order('created_at');
  const byYM = {};
  (myPosts||[]).forEach(p=>{
    const [y,m] = p.post_date.split('-').map(Number);
    const key = y+'-'+(m-1);
    if(!byYM[key]) byYM[key] = [];
    byYM[key].push(p);
  });

  const available = [];
  for(let y=currentYear-MIN_YEAR_BACK; y<=currentYear; y++){ available.push(y); }

  const pageEl = document.getElementById('albumPage');
  albumState = { byYM, currentYear, currentMonth, available, current: currentYear, pageEl, animating:false };
  buildAlbumDOM(albumState);
  renderAlbumStatic(albumState);
  attachAlbumSwipe(albumState);
}

function tileHTML(year, m){
  const started = year < albumState.currentYear || (year===albumState.currentYear && m<=albumState.currentMonth);
  if(!started) return `<div class="mini-frame not-started"><div class="mini-photo-empty"></div></div>`;
  const arr = albumState.byYM[year+'-'+m] || [];
  const cover = arr[0];
  const rot = [-2,1.5,-1,2,-1.5,1][m%6];
  const countBadge = arr.length>1 ? `<div class="mini-count">${arr.length}</div>` : '';
  const handlers = `onpointerdown="tileDown(${year},${m})" onpointerup="tileUp(${year},${m})" onpointerleave="tileCancel()" onpointercancel="tileCancel()"`;
  if(cover){
    const media = cover.media_type==='video'
      ? `<video class="mini-photo" src="${cover.media_url}"></video>`
      : `<img class="mini-photo" src="${cover.media_url}">`;
    return `<div class="mini-frame" style="transform:rotate(${rot}deg)" ${handlers}>
      <div class="mini-tape"></div>
      ${media}
      ${countBadge}
      <div class="mini-caption">${monthsFR[m]}</div>
    </div>`;
  }
  return `<div class="mini-frame" style="transform:rotate(${rot}deg); opacity:0.6;" ${handlers}>
    <div class="mini-photo-empty"></div>
    <div class="mini-caption">${monthsFR[m]}</div>
  </div>`;
}
function albumLeafHTML(year, from, to){
  let tiles = '';
  for(let m=from; m<to; m++){ tiles += tileHTML(year, m); }
  return `<div class="leaf-year">${year}</div><div class="grid6">${tiles}</div>`;
}
function buildAlbumDOM(state){
  state.pageEl.innerHTML = `
    <div class="spread">
      <div class="leaf-slot">
        <div class="leaf-static"></div>
        <div class="leaf-flap">
          <div class="leaf-underlay"></div>
          <div class="leaf-flip"><div class="flip-face flip-face-front"></div><div class="flip-face flip-face-back"></div></div>
        </div>
      </div>
      <div class="gutter"></div>
      <div class="leaf-slot">
        <div class="leaf-static"></div>
        <div class="leaf-flap">
          <div class="leaf-underlay"></div>
          <div class="leaf-flip"><div class="flip-face flip-face-front"></div><div class="flip-face flip-face-back"></div></div>
        </div>
      </div>
    </div>`;
  const slots = state.pageEl.querySelectorAll('.leaf-slot');
  state.leftSlot = slots[0]; state.rightSlot = slots[1];
  state.leftStatic = slots[0].querySelector('.leaf-static');
  state.leftFlap = slots[0].querySelector('.leaf-flap');
  state.rightStatic = slots[1].querySelector('.leaf-static');
  state.rightFlap = slots[1].querySelector('.leaf-flap');
}
function renderAlbumStatic(state){
  state.leftStatic.innerHTML = albumLeafHTML(state.current, 0, 6);
  state.rightStatic.innerHTML = albumLeafHTML(state.current, 6, 12);
}
function animateAlbumFlap(slotEl, flapEl, direction, beforeHTML, afterHTML, onDone){
  const front = flapEl.querySelector('.flip-face-front');
  const back = flapEl.querySelector('.flip-face-back');
  const underlay = flapEl.querySelector('.leaf-underlay');
  front.innerHTML = beforeHTML;
  back.innerHTML = afterHTML;
  underlay.innerHTML = afterHTML;
  flapEl.classList.add('active');
  slotEl.classList.add('elevated');
  const cls = direction==='forward' ? 'flip-fwd' : 'flip-back';
  const flip = flapEl.querySelector('.leaf-flip');
  flip.classList.add(cls);
  const onEnd = ()=>{
    flip.removeEventListener('animationend', onEnd);
    flip.classList.remove(cls);
    flapEl.classList.remove('active');
    slotEl.classList.remove('elevated');
    onDone();
  };
  flip.addEventListener('animationend', onEnd);
}
function flipAlbumTo(state, newYear){
  if(!state.available.includes(newYear) || newYear===state.current || state.animating) return;
  const forward = newYear > state.current;
  state.animating = true;
  if(forward){
    state.leftStatic.innerHTML = albumLeafHTML(newYear, 0, 6);
    animateAlbumFlap(state.rightSlot, state.rightFlap, 'forward',
      albumLeafHTML(state.current, 6, 12), albumLeafHTML(newYear, 6, 12),
      ()=>{ state.rightStatic.innerHTML = albumLeafHTML(newYear, 6, 12); state.current = newYear; state.animating = false; }
    );
  } else {
    state.rightStatic.innerHTML = albumLeafHTML(newYear, 6, 12);
    animateAlbumFlap(state.leftSlot, state.leftFlap, 'backward',
      albumLeafHTML(state.current, 0, 6), albumLeafHTML(newYear, 0, 6),
      ()=>{ state.leftStatic.innerHTML = albumLeafHTML(newYear, 0, 6); state.current = newYear; state.animating = false; }
    );
  }
}
function attachAlbumSwipe(state){
  let startX = null;
  const el = state.pageEl;
  el.addEventListener('pointerdown', e=>{ startX = e.clientX; });
  el.addEventListener('pointerup', e=>{
    if(startX===null) return;
    const dx = e.clientX - startX;
    if(Math.abs(dx) > 35){ flipAlbumTo(state, dx<0 ? state.current+1 : state.current-1); }
    startX = null;
  });
  el.addEventListener('touchstart', e=>{ startX = e.touches[0].clientX; }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(startX===null) return;
    const dx = e.changedTouches[0].clientX - startX;
    if(Math.abs(dx) > 35){ flipAlbumTo(state, dx<0 ? state.current+1 : state.current-1); }
    startX = null;
  }, {passive:true});
}

/* ---------- Story plein écran pour un mois ---------- */
let monthStoryState = null;
function openMonthStory(year, month){
  const posts = albumState.byYM[year+'-'+month] || [];
  if(!posts.length) return;
  monthStoryState = { year, month, posts, index:0, timer:null, captionExpanded:false };
  document.getElementById('monthStoryTitle').textContent = monthsFR[month] + ' ' + year;
  document.getElementById('monthStoryOverlay').classList.add('open');
  renderMonthStory();
}
function closeMonthStory(){
  if(monthStoryState){ clearTimeout(monthStoryState.timer); }
  document.getElementById('monthStoryOverlay').classList.remove('open');
  document.getElementById('monthStoryMedia').innerHTML = '';
  monthStoryState = null;
}
function firstSentence(text){
  const m = text.match(/^.*?[.!?](?:\s|$)/);
  const first = m ? m[0].trim() : text;
  return { first, hasMore: first.length < text.length };
}
function renderMonthStory(){
  const s = monthStoryState;
  clearTimeout(s.timer);
  const p = s.posts[s.index];
  document.getElementById('monthStoryBars').innerHTML = s.posts.map((_,i)=>{
    const cls = i<s.index ? 'done' : (i===s.index ? 'active' : '');
    return `<div class="bar ${cls}"><div class="fill"></div></div>`;
  }).join('');
  const mediaBox = document.getElementById('monthStoryMedia');
  let captionHTML = '';
  if(p.caption){
    const { first, hasMore } = firstSentence(p.caption);
    captionHTML = `<div class="story-caption ${s.captionExpanded?'expanded':''}" onclick="event.stopPropagation(); toggleMonthStoryCaption();">
      ${s.captionExpanded ? p.caption : first + (hasMore ? ' <span class="more">plus</span>' : '')}
    </div>`;
  }
  const tapsHTML = `<div class="story-taps"><div onclick="monthStoryPrev()"></div><div onclick="monthStoryNext()"></div></div>`;
  if(p.media_type==='video'){
    mediaBox.innerHTML = `<video src="${p.media_url}" autoplay playsinline></video>${tapsHTML}${captionHTML}`;
    const v = mediaBox.querySelector('video');
    v.onended = ()=>monthStoryNext();
  } else {
    mediaBox.innerHTML = `<img src="${p.media_url}">${tapsHTML}${captionHTML}`;
    if(!s.captionExpanded){ s.timer = setTimeout(()=>monthStoryNext(), 3000); }
  }
}
function toggleMonthStoryCaption(){
  const s = monthStoryState; if(!s) return;
  s.captionExpanded = !s.captionExpanded;
  renderMonthStory();
}
function monthStoryNext(){
  const s = monthStoryState; if(!s) return;
  s.captionExpanded = false;
  if(s.index < s.posts.length-1){ s.index++; renderMonthStory(); }
  else { closeMonthStory(); }
}
function monthStoryPrev(){
  const s = monthStoryState; if(!s) return;
  s.captionExpanded = false;
  if(s.index>0){ s.index--; renderMonthStory(); }
}

function renderEditorList(){

    const thumb = p.media_type==='video' ? `<video src="${p.media_url}"></video>` : `<img src="${p.media_url}">`;

async function deleteEditorItem(i){

/* ---- Panneau de légende (ajout ou modification) ---- */
let captionPanelMode = null, captionPanelFile = null, captionPanelIndex = null;
let captionQueue = [];
let editorQueueDone = 0;

function onEditorFilesPicked(fileList){
  const files = Array.from(fileList || []);
  if(files.length===0) return;
  captionQueue = files;
  editorQueueDone = 0;
  showNextQueuedFile();
}
function showNextQueuedFile(){
  if(captionQueue.length===0){ closeCaptionPanel(); renderEditorList(); return; }
  const file = captionQueue[0];
  captionPanelMode = 'add';
  captionPanelFile = file;
  const url = URL.createObjectURL(file);
  document.getElementById('captionPanelMedia').innerHTML = file.type.startsWith('video')
    ? `<video src="${url}" controls></video>` : `<img src="${url}">`;
  document.getElementById('captionPanelInput').value = '';
  document.getElementById('captionPanelBtn').textContent = captionQueue.length>1
    ? `Ajouter (reste ${captionQueue.length})` : 'Ajouter';
  document.getElementById('captionPanel').classList.add('open');
}
function openEditCaption(i){
  captionPanelMode = 'edit';
  captionPanelIndex = i;
  const p = editorItems[i];
  document.getElementById('captionPanelMedia').innerHTML = p.media_type==='video'
    ? `<video src="${p.media_url}" controls></video>` : `<img src="${p.media_url}">`;
  document.getElementById('captionPanelInput').value = p.caption || '';
  document.getElementById('captionPanelBtn').textContent = 'Enregistrer';
  document.getElementById('captionPanel').classList.add('open');
}
function closeCaptionPanel(){
  document.getElementById('captionPanel').classList.remove('open');
  document.getElementById('editorUploadInput').value = '';
  captionPanelMode = null; captionPanelFile = null; captionPanelIndex = null;
  captionQueue = []; editorQueueDone = 0;
}
async function confirmCaptionPanel(){
  const caption = document.getElementById('captionPanelInput').value.trim();
  const msg = document.getElementById('editorMsg');
  if(captionPanelMode === 'add'){
    msg.innerHTML = `<div class="msg">Envoi en cours…</div>`;
    const { year, month } = editorTarget;
    const postDateISO = `${year}-${String(month+1).padStart(2,'0')}-15`;
    const nextOrder = editorItems.reduce((mx,p)=>Math.max(mx, p.sort_order||0), 0) + 1;
    const file = captionPanelFile;
    const mediaType = file.type && file.type.startsWith('video') ? 'video' : 'photo';
    const path = `${session.user.id}/${Date.now()}_${file.name}`;
    const { error: upErr } = await sb.storage.from('photos').upload(path, file);
    if(upErr){ msg.innerHTML = `<div class="msg error">${upErr.message}</div>`; return; }
    const { data: pub } = sb.storage.from('photos').getPublicUrl(path);
    const { data: inserted, error: insErr } = await sb.from('posts').insert({
      author_id: session.user.id, media_url: pub.publicUrl, media_type: mediaType, caption, post_date: postDateISO, sort_order: nextOrder
    }).select().single();
    if(insErr){ msg.innerHTML = `<div class="msg error">${insErr.message}</div>`; return; }
    editorItems.push(inserted);
    editorQueueDone++;
    captionQueue.shift();
    msg.innerHTML = `<div class="msg">Ajouté !</div>`;
    if(captionQueue.length>0){ showNextQueuedFile(); renderEditorList(); return; }
  } else if(captionPanelMode === 'edit'){
    const item = editorItems[captionPanelIndex];
    msg.innerHTML = `<div class="msg">Enregistrement…</div>`;
    const { error } = await sb.from('posts').update({ caption }).eq('id', item.id);
    if(error){ msg.innerHTML = `<div class="msg error">${error.message}</div>`; return; }
    item.caption = caption;
    msg.innerHTML = '';
  }
  closeCaptionPanel();
  renderEditorList();
}

function startDrag(e, idx){
  dragIdx = idx;
  dragEl = e.target.closest('.editor-row');
  dragEl.classList.add('dragging');
  try{ e.target.setPointerCapture(e.pointerId); }catch(err){}
  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', onDragEnd);
}
function onDragMove(e){
  if(dragIdx===null) return;
  const rows = Array.from(document.querySelectorAll('.editor-row'));
  for(const row of rows){
    const rect = row.getBoundingClientRect();
    const mid = rect.top + rect.height/2;
    const idx = parseInt(row.dataset.idx,10);
    if(idx!==dragIdx && e.clientY>=rect.top && e.clientY<=rect.bottom){
      const moved = editorItems.splice(dragIdx,1)[0];
      editorItems.splice(idx,0,moved);
      dragIdx = idx;
      renderEditorList();
      const newDragEl = document.querySelector(`.editor-row[data-idx="${dragIdx}"]`);
      if(newDragEl) newDragEl.classList.add('dragging');
      break;
    }
  }
}
async function onDragEnd(){
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
  dragIdx = null;
  const updates = editorItems.map((p,i)=>({ id:p.id, sort_order:i }));
  for(const u of updates){
    await sb.from('posts').update({ sort_order: u.sort_order }).eq('id', u.id);
  }
  editorItems.forEach((p,i)=>p.sort_order=i);
  renderEditorList();
}

/* ---------- Caméra / story en direct ---------- */
let cameraStream = null;
let capturedFile = null;

async function openCamera(){
  document.getElementById('cameraModal').classList.add('open');
  document.getElementById('cameraPreview').classList.remove('open');
  document.getElementById('cameraVideo').style.display = 'block';
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    document.getElementById('cameraVideo').srcObject = cameraStream;
  } catch(err){
    // Pas d'accès caméra : on ouvre directement la galerie
    document.getElementById('cameraGalleryInput').click();
  }
}
function stopCameraStream(){
  if(cameraStream){ cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
}
function closeCamera(){
  document.getElementById('cameraModal').classList.remove('open');
  document.getElementById('cameraPreview').classList.remove('open');
  stopCameraStream();
  capturedFile = null;
  document.getElementById('cameraCaption').value = '';
}
function captureCameraPhoto(){
  const video = document.getElementById('cameraVideo');
  const canvas = document.getElementById('cameraCanvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  canvas.toBlob(blob => {
    capturedFile = new File([blob], `story_${Date.now()}.jpg`, { type: 'image/jpeg' });
    showCameraPreview(capturedFile);
  }, 'image/jpeg', 0.92);
  stopCameraStream();
}
function handleCameraFile(file){
  if(!file) return;
  capturedFile = file;
  stopCameraStream();
  showCameraPreview(file);
}
function showCameraPreview(file){
  document.getElementById('cameraVideo').style.display = 'none';
  const url = URL.createObjectURL(file);
  document.getElementById('cameraPreviewMedia').innerHTML = file.type.startsWith('video')
    ? `<video src="${url}" controls></video>`
    : `<img src="${url}">`;
  document.getElementById('cameraPreview').classList.add('open');
}
function retakeCamera(){
  capturedFile = null;
  document.getElementById('cameraPreview').classList.remove('open');
  openCamera();
}
async function publishCameraCapture(){
  const msg = document.getElementById('cameraMsg');
  if(!capturedFile) return;
  const caption = document.getElementById('cameraCaption').value.trim();
  msg.innerHTML = `<div class="msg">Envoi en cours…</div>`;
  const { error } = await publishMedia(capturedFile, caption, todayISO());
  if(error){ msg.innerHTML = `<div class="msg error">${error}</div>`; return; }
  closeCamera();
  loadAlbum();
}
</script>
